<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

  {% include head.html %}

  <body>

    {% include header.html %}

    <main id="content" class="page-content" tabindex="-1">
      <div class="wrapper">
        {{ content }}
      </div>

      <a class="back-to-top" href="#content" aria-label="Back to top" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </main>

    {% include footer.html %}

    <script src="{{ "/assets/js/site.js" | prepend: site.baseurl }}?v={{ site.time | date: '%s' }}" defer></script>

  </body>

</html>
