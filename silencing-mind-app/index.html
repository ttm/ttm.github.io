<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silencing the Mind Playground</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Silencing the Mind</h1>
      <p class="tagline">
        Explore, tweak and refine your path to inner calm
      </p>
    </header>

    <section id="controls">
      <div class="slider-container">
        <label for="noiseSlider">Mental Noise Level</label>
        <input type="range" id="noiseSlider" min="0" max="100" value="50" />
      </div>
      <div class="theme-toggle">
        <label for="themeToggle">Dark Mode</label>
        <input type="checkbox" id="themeToggle" />
      </div>
    </section>

    <section id="breathing">
      <h2>Breathing Exercise</h2>
      <div id="breathing-circle-container">
        <div id="breathing-circle"></div>
        <div id="breathing-instructions">Press Start</div>
      </div>
      <div class="breathing-controls">
        <button id="breathingStart">Start</button>
        <button id="breathingStop" disabled>Stop</button>
      </div>
    </section>

    <section id="tasks">
      <h2>Mindfulness Tasks</h2>
      <div id="task-list"></div>
    </section>

    <section id="reference">
      <h2>Learn</h2>
      <div id="article">
        <p>
          Explore quick practices, extended disciplines, scientific and spiritual
          perspectives and tech innovations for inner calm.
          <a
            href="/2025/08/08/silencing-the-mind.html"
            target="_blank"
            >Read the full article</a
          >.
        </p>
      </div>
    </section>

    <div id="modal" class="hidden">
      <div class="modal-content">
        <h3 id="modal-title"></h3>
        <p id="modal-desc"></p>
        <div id="modal-timer" class="hidden"></div>
        <button id="modal-action">Start</button>
        <button id="modal-close">Close</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
