tagline: >-
  Italo-Brazilian physicist (PhD), researcher, software architect, artist and musician.
# Homepage introduction (Markdown)
intro: >-
  I build technology for sensory stimulation: [BioSynCare](https://biosyncare.com),
  an app for audiovisual stimulation and brainwave entrainment, and
  [SSTIM](https://w3c-cg.github.io/sstim/), an open reference for the field
  developed in a W3C Community Group. I also write here about AI, science and
  spirituality.
email: renato.fabbri@gmail.com
# Used for search results, link previews and the footer
description: >-
  Physicist (PhD), researcher and software architect building BioSynCare and
  SSTIM for sensory stimulation, and writing about AI, complex networks, linked
  data, language, music and spirituality.
