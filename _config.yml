      path: ""
    values:
      image: /assets/og-image.png
  # impress.js demo copy, not part of the site's content
  - scope:
      path: presentation.html
    values:
      sitemap: false

# Build settings
markdown: kramdown
# Not a valid IANA zone, so builds use UTC. Switching to America/Sao_Paulo
# would move posts dated near midnight UTC (and their URLs) to another day.
timezone: America/Rio_de_Janeiro
sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-sitemap

# Jekyll 3 replaces (rather than extends) the default list, so keep its entries.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - runme.sh
  - README.md
