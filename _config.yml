defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-image.png
  # impress.js demo copy, not part of the site's content
  - scope:
      path: presentation.html
    values:
      sitemap: false

# Build settings
markdown: kramdown
# Post dates (and the dates in post URLs) are computed in this zone.
# Changing it can move a post written near midnight to another day.
timezone: Europe/Rome
sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-sitemap

# Jekyll 3 replaces (rather than extends) the default list, so keep its entries.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - runme.sh
  - README.md
