<head>
  <meta charset="utf-8" />
  <script>
    // GitHub Pages still answers plain HTTP for this site (its "Enforce
    // HTTPS" setting is off); move such visits to HTTPS.
    if (location.protocol === "http:" && location.hostname === "ttm.github.io") location.replace("https:" + location.href.slice(5));
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#101417" media="(prefers-color-scheme: dark)" />
  <script>
    // Apply a saved theme before first paint; with no saved choice the
    // stylesheet follows prefers-color-scheme on its own.
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}?v={{ site.time | date: '%s' }}" />
  {% seo %}
  <link rel="alternate" type="application/rss+xml" title="{{ site.short_title | default: site.title | escape }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}" />
  <link id="favicon" rel="icon" type="image/png" href="{{ "/favicon_light.ico" | prepend: site.baseurl }}" />
  <link rel="apple-touch-icon" href="{{ "/assets/apple-touch-icon.png" | prepend: site.baseurl }}" />
  <script>
    // The tab strip follows the OS theme, not the page theme, so pick the
    // favicon that contrasts with it.
    (function () {
      var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
      if (!mq) return;
      function update() {
        document.getElementById("favicon").href = "{{ site.baseurl }}" + (mq.matches ? "/favicon_dark.ico" : "/favicon_light.ico");
      }
      update();
      if (mq.addEventListener) mq.addEventListener("change", update);
    })();
  </script>
  {% if page.math or content contains '\(' or content contains '\[' %}{% include mathjax.html %}{% endif %}
</head>
