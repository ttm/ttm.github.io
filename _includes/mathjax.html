<script>
    // kramdown turns $$...$$ into \(...\) (inline) and \[...\] (display).
    window.MathJax = {
      tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]] },
      options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] },
      startup: {
        // Tell site.js when formulas are on the page (it fits wide ones).
        pageReady: function () {
          return MathJax.startup.defaultPageReady().then(function () {
            window.mathjaxReady = true;
            document.dispatchEvent(new Event("mathjax-ready"));
          });
        }
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
