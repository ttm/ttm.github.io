<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
  <div class="wrapper header-inner">
    <a class="site-brand" href="{{ site.baseurl }}/" rel="home">
      {% include logo.html %}
      <span class="site-title">{{ site.short_title | default: site.title }}</span>
    </a>

    <nav class="site-nav" aria-label="Main">
      <ul>
        {% for item in site.data.navigation %}
        <li><a class="page-link" href="{{ item.url | prepend: site.baseurl }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>

    <button class="theme-toggle" type="button" aria-pressed="false" title="Toggle dark theme" hidden>
      <span class="visually-hidden">Dark theme</span>
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12h2.5M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g></svg>
    </button>
  </div>
</header>
